name: test
on:
  push:
  pull_request:
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [18, 22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: node --version
      - run: node --test
      - name: Validate the plugin (only when the claude CLI is available)
        shell: bash
        run: |
          if command -v claude >/dev/null 2>&1; then
            claude plugin validate --strict . 2>/dev/null || claude plugin validate .
          else
            echo "claude CLI not available; skipping plugin validation"
          fi
